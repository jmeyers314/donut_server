[project]
name = "donut-server"
version = "0.1.0"
description = "Mock on-demand wavefront-estimation service (producer/coordinator/fork-worker prototype)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["protocol", "exposure_codec", "coordinator", "server", "client"]
