<!DOCTYPE html>
<!--
  donut_server monitoring dashboard, served by GET /dashboard to localhost callers
  only -- so there is no token here, and no credential of any kind. Self-contained
  on purpose -- no build step, no CDN, no template engine, because nothing on this
  page is rendered server-side.

  Two rules here are load-bearing rather than stylistic:

  - Every dynamic string goes in via textContent, never innerHTML. The log panel
    renders arbitrary bytes emitted by the LSST stack, which is by itself enough to
    need this.
  - GET /health answers 503 whenever the coordinator is not READY, and the body is
    fully populated in that case. So a non-OK response is normal here and must
    still be parsed; 401/403 is the separate case of this page having been loaded
    from somewhere other than localhost.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>donut_server</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b; --ink: #d8dde5;
    --dim: #8b93a1; --ok: #4ba36b; --warn: #c99a3d; --bad: #c2564f;
    --live: #4a86c7; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 var(--mono);
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .host { color: var(--dim); }
  .spacer { flex: 1 1 auto; }
  input[type=number] {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 6px; font: inherit; width: 7ch;
  }
  button {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 9px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button.armed { border-color: var(--bad); color: var(--bad); }
  button.sel { border-color: var(--live); color: var(--live); }
  section { border-bottom: 1px solid var(--line); padding: 12px 14px; }
  h2 {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }
  h2 .note { text-transform: none; letter-spacing: 0; color: var(--ink); margin-left: 10px; }
  .banner { padding: 8px 14px; background: #3a2320; color: #f0c9c4; display: none; }
  .banner.on { display: block; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: var(--dim); }
  .facts b { color: var(--ink); font-weight: 600; }
  .chip {
    border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; color: var(--dim);
  }
  .chip.on { border-color: var(--ok); color: var(--ok); }
  .chip.off { border-color: var(--bad); color: var(--bad); }
  .loss { margin-top: 8px; color: var(--warn); max-width: 110ch; }
  .loss:empty { display: none; }
  /* --- flights ---
     Side by side, because two lanes are read by comparing them: one at 5.8 GB
     while the other sits at 1.2 GB is the kind of thing a vertical stack hides.
     flex-wrap and a min-width mean 3+ flights wrap into rows rather than
     squeezing every diagram until its labels collide. */
  .lanes { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .lanes > * { flex: 1 1 420px; min-width: 380px; }
  .flight { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
  .fhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .ftitle { color: var(--ink); font-weight: 600; }
  /* The per-flight job panel: same column geometry as the flight above it, so the
     two sections line up and lane N is always in the same place on the page. */
  .jobcol { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
  .jobcol .note { display: block; margin-top: 2px; color: var(--dim); }
  .jobcol .note b { color: var(--ink); font-weight: 600; }
  /* --- plot flights ---
     Deliberately one compact row each, with no state-machine diagram: a plot
     flight has the same five states as a coordinator, but nothing is blocked on
     it and the only questions are "is it up" and "how far behind". The full
     treatment above would imply it mattered as much as a Zernike lane. */
  #plotrows { display: flex; flex-direction: column; gap: 4px; }
  .prow {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px;
    color: var(--dim);
  }
  .prow b { color: var(--ink); font-weight: 600; }
  .prow .jid { color: var(--live); }
  /* --- state machine diagrams --- */
  svg { display: block; max-width: 100%; height: auto; }
  .nbox { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; rx: 4; }
  .nlabel { fill: var(--dim); font: 600 12px var(--mono); text-anchor: middle; }
  .node.current .nbox { stroke: var(--live); stroke-width: 2.2; fill: #1b2735; }
  .node.current .nlabel { fill: #cfe2f7; }
  .node.term.current .nbox { stroke: var(--ok); fill: #1a2820; }
  .node.term.current .nlabel { fill: #bfe3cc; }
  .node.bad.current .nbox { stroke: var(--bad); fill: #2b1d1c; }
  .node.bad.current .nlabel { fill: #f0c9c4; }
  .edge { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .edge.hot { stroke: var(--warn); stroke-width: 2; }
  .etext { fill: var(--dim); font: 10px var(--mono); }
  /* --- tables --- */
  table { border-collapse: collapse; width: 100%; }
  th {
    text-align: left; color: var(--dim); font-weight: 600; padding: 3px 8px 6px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 3px 8px; border-bottom: 1px solid #232730; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #21252d; }
  /* Two different things, deliberately not the same colour. `.sel` is the row the
     detail panel is following on its own -- whatever is in flight, or the newest
     job -- and `.pin` is a row the operator clicked, which stops that following. */
  tbody tr.sel td { background: #1b2735; }
  tbody tr.pin td { background: #24303f; box-shadow: inset 0 0 0 1px var(--live); }
  td.num, th.num { text-align: right; }
  .s-DONE { color: var(--ok); }
  .s-ERROR { color: var(--bad); }
  .s-COMPUTING, .s-RECEIVING, .s-PREPARED { color: var(--live); }
  a { color: var(--live); }
  /* --- detail --- */
  #detail { color: var(--dim); }
  #detail .row { margin-top: 6px; }
  #detail b { color: var(--ink); font-weight: 600; }
  .bar { display: flex; height: 16px; width: 100%; border: 1px solid var(--line); margin: 6px 0 2px; }
  .bar div { overflow: hidden; font-size: 9px; line-height: 16px; text-align: center; color: #10131a; }
  .err { color: var(--bad); white-space: pre-wrap; }
  /* --- log --- */
  #logtext {
    margin: 0; padding: 8px; background: #10131a; border: 1px solid var(--line);
    height: 22em; overflow: auto; white-space: pre; font-size: 12px; color: #c3cad6;
  }
  .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ctl label { color: var(--dim); }
  .path { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header>
  <h1>donut_server</h1>
  <span class="host" id="host"></span>
  <span class="spacer"></span>
  <!-- This process: the uvicorn front-end that owns the job history, the shared
       blocks and every flight. Its pid is the one to signal, and it is the only
       pid on this page that is not a coordinator child's. -->
  <span class="host" id="frontend"></span>
  <span class="chip" id="poll">idle</span>
  <button id="restart">restart all flights</button>
</header>

<div class="banner" id="banner"></div>

<!-- The arrow markers live here rather than in the coordinator diagram, because
     that diagram is now cloned per flight and the job diagram references the same
     markers by id -- so they must sit in exactly one place that is always in the
     document. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b616d"/>
    </marker>
    <marker id="ar-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c99a3d"/>
    </marker>
  </defs>
</svg>

<section>
  <h2>Coordinator flights <span class="note" id="coord-note"></span></h2>
  <!-- One of these per flight, cloned at render time and its ids prefixed "fN-".
       A template's content is inert and not part of the document, so the ids below
       never collide with the clones' -- but they are still the ids paint() looks
       for, after prefixing. -->
  <template id="flight-tpl">
  <div class="flight">
  <div class="fhead">
    <span class="ftitle" data-el="title"></span>
    <span class="note" data-el="note"></span>
    <span class="spacer"></span>
    <button data-el="restart">restart</button>
  </div>
  <svg viewBox="0 0 860 200" role="img" aria-label="coordinator state machine">
    <!-- starting -> degraded, routed above the row (attempts exhausted) -->
    <path class="edge" d="M90,40 L90,20 L702,20 L702,40" marker-end="url(#ar)"/>
    <text class="etext" x="200" y="15">bring-up attempts exhausted</text>
    <!-- starting -> ready -->
    <path class="edge" d="M150,60 L214,60" marker-end="url(#ar)"/>
    <!-- ready -> restarting -->
    <path id="e-ready-restarting" class="edge" d="M334,54 L438,54" marker-end="url(#ar)"/>
    <!-- restarting -> ready -->
    <path class="edge" d="M438,66 L334,66" marker-end="url(#ar)"/>
    <!-- restarting -> degraded -->
    <path class="edge" d="M578,60 L678,60" marker-end="url(#ar)"/>
    <!-- degraded -> restarting (the only way out) -->
    <path class="edge" d="M726,84 L726,120 L508,120 L508,84" marker-end="url(#ar)"/>
    <text class="etext" x="560" y="136">POST /admin/restart</text>
    <!-- any -> stopping -->
    <path class="edge" d="M274,84 L274,150" marker-end="url(#ar)"/>
    <text class="etext" x="284" y="116">aclose()</text>

    <g class="node" id="c-starting">
      <rect class="nbox" x="30" y="40" width="120" height="40"/>
      <text class="nlabel" x="90" y="65">starting</text>
    </g>
    <g class="node term" id="c-ready">
      <rect class="nbox" x="214" y="40" width="120" height="40"/>
      <text class="nlabel" x="274" y="65">ready</text>
    </g>
    <g class="node" id="c-restarting">
      <rect class="nbox" x="438" y="40" width="140" height="40"/>
      <text class="nlabel" x="508" y="65">restarting</text>
    </g>
    <g class="node bad" id="c-degraded">
      <!-- An SVG <title> is the hover text for its group, and the answer to the
           question this state keeps prompting: degraded is not "slow" or
           "unhealthy", it is this lane having given up. -->
      <title>degraded: this flight gave up relaunching its coordinator — it has no
child, serves no job, and stays this way until POST /admin/restart. Either
bring-up failed max_restart_attempts times in a row, or the child reported a
config error that retrying cannot fix. The other flights keep serving.</title>
      <rect class="nbox" x="678" y="40" width="120" height="40"/>
      <text class="nlabel" x="738" y="65">degraded</text>
    </g>
    <g class="node" id="c-stopping">
      <rect class="nbox" x="214" y="150" width="120" height="36"/>
      <text class="nlabel" x="274" y="173">stopping</text>
    </g>
  </svg>
  <div class="facts" data-el="facts"></div>
  <div class="loss" data-el="loss"></div>
  </div>
  </template>
  <div class="lanes" id="flights"></div>
</section>

<section>
  <h2>Current job per flight <span class="note" id="job-note"></span></h2>
  <!-- Cloned per flight exactly like #flight-tpl, and for the same reason: with N
       lanes there are N jobs in flight at once, and one diagram could only ever
       show one of them. ids are prefixed "jN-" at render time. -->
  <template id="job-tpl">
  <div class="jobcol">
  <div class="fhead">
    <span class="ftitle" data-el="title"></span>
  </div>
  <span class="note" data-el="note"></span>
  <svg viewBox="0 0 860 190" role="img" aria-label="job state machine">
    <path class="edge" d="M94,10 L94,24" marker-end="url(#ar)"/>
    <text class="etext" x="30" y="9">POST /prepare</text>
    <path class="edge" d="M158,44 L206,44" marker-end="url(#ar)"/>
    <path class="edge" d="M346,44 L394,44" marker-end="url(#ar)"/>
    <path class="edge" d="M534,44 L582,44" marker-end="url(#ar)"/>
    <!-- Only RECEIVING and COMPUTING reach ERROR. A prepare that fails creates the
         record already in ERROR (server.py:803) -- it is never PREPARED -- so that
         is an entry edge, and DONE is terminal. -->
    <path class="edge" d="M276,74 L276,98 L360,98" />
    <path class="edge" d="M464,74 L464,98 L360,98" />
    <path class="edge" d="M360,98 L360,112" marker-end="url(#ar)"/>
    <path class="edge" d="M200,135 L300,135" marker-end="url(#ar)"/>
    <text class="etext" x="112" y="136">prepare failed</text>

    <g class="node" id="j-PREPARED">
      <rect class="nbox" x="30" y="24" width="128" height="44"/>
      <text class="nlabel" x="94" y="51">PREPARED</text>
    </g>
    <g class="node" id="j-RECEIVING">
      <rect class="nbox" x="206" y="24" width="140" height="44"/>
      <text class="nlabel" x="276" y="51">RECEIVING</text>
    </g>
    <g class="node" id="j-COMPUTING">
      <rect class="nbox" x="394" y="24" width="140" height="44"/>
      <text class="nlabel" x="464" y="51">COMPUTING</text>
    </g>
    <g class="node term" id="j-DONE">
      <rect class="nbox" x="582" y="24" width="120" height="44"/>
      <text class="nlabel" x="642" y="51">DONE</text>
    </g>
    <g class="node bad" id="j-ERROR">
      <rect class="nbox" x="300" y="112" width="120" height="44"/>
      <text class="nlabel" x="360" y="139">ERROR</text>
    </g>
  </svg>
  </div>
  </template>
  <div class="lanes" id="jobs-per-flight"></div>
</section>

<section>
  <h2>Plot flights <span class="note" id="plot-note"></span></h2>
  <div class="ctl">
    <button id="backfill">backfill missing plots</button>
    <span class="note" id="backfill-note"></span>
  </div>
  <div id="plotrows"></div>
</section>

<section>
  <h2>Jobs <span class="note" id="jobs-note"></span></h2>
  <div class="ctl">
    <label for="limit">limit</label>
    <input type="number" id="limit" value="50" min="1" max="500">
    <!-- Hidden until a row is pinned: with nothing pinned there is nothing to
         clear, and a permanently visible dead button invites the question of what
         it would do. -->
    <button id="unpin" style="display:none">unpin — follow the newest job</button>
  </div>
  <table>
    <thead><tr>
      <!-- `flight` rather than `blob`: the push size is the same ~308 MB on every
           job, so the column never said anything, while which lane ran a job is
           now what the two sections above are organized by. It is still in the
           detail panel below for the one job that panel is about.

           `runQuantum` and `parquet` are gone for the same reason: runQuantum is
           most of `coord total` on every job, and is broken out exactly against
           it in the detail panel's phase bar; the parquet size tracks `rows` and
           is on the download itself. Neither distinguished one row from another. -->
      <th>job</th><th class="num">flight</th><th class="num">visit</th>
      <th>state</th><th>created</th>
      <th class="num">age</th>
      <th class="num">coord total</th>
      <th class="num">rows</th><th class="num">dets</th><th class="num">groups</th>
      <th>results</th>
    </tr></thead>
    <tbody id="jobs-body"></tbody>
  </table>
  <div id="detail"></div>
</section>

<section>
  <h2>Log</h2>
  <div class="ctl">
    <button id="tab-tail" class="sel">live tail</button>
    <button id="tab-job">current job</button>
    <label><input type="checkbox" id="log-auto" checked> auto</label>
    <label for="log-bytes">bytes</label>
    <input type="number" id="log-bytes" value="65536" min="4096" max="1048576" step="4096">
    <span class="path" id="log-path"></span>
  </div>
  <pre id="logtext"></pre>
</section>

<script>
"use strict";

// ----------------------------------------------------------------------- fetch

const el = (id) => document.getElementById(id);
let logSize = -1;
el("host").textContent = location.host;

// Keyed rather than a single slot, and only ever cleared by the same key that set
// it. A shared banner is worse than none: /health never refuses a caller, it just
// downgrades to its minimal public body (server.py:985), so a success there would
// clear an /admin/jobs denial a fraction of a second after it appeared, leaving a
// dashboard that looks healthy while being locked out of every endpoint that
// carries job data.
const problems = new Map();

function banner(key, msg) {
  if (msg) problems.set(key, msg); else problems.delete(key);
  const b = el("banner");
  b.textContent = [...problems.values()].join("   •   ");
  b.classList.toggle("on", problems.size > 0);
}

// /health answers 503 whenever the coordinator is not READY, with a full body, so
// a non-OK status is normal and still has to be parsed. The auth branches are not
// dead code even though this page carries no credential: reaching the server from
// anything but localhost is refused, and that is worth saying rather than showing
// empty panels.
async function api(path, opts) {
  const init = Object.assign({cache: "no-store"}, opts || {});
  const key = path.split("?")[0];
  let r;
  try {
    r = await fetch(path, init);
  } catch (e) {
    banner(key, "cannot reach " + key + " — is the server up?");
    throw e;
  }
  if (r.status === 401 || r.status === 403) {
    banner("auth", r.status + " on " + key +
      " — the server only serves this page to localhost. Open it on the server " +
      "host itself, or forward the port with ssh -L 8000:localhost:8000.");
    return null;
  }
  banner(key, null);
  if (key !== "/health") banner("auth", null);
  return r.json();
}

// ------------------------------------------------------------------ formatting

const fmt = {
  secs: (s) => (s === null || s === undefined) ? "–" : s.toFixed(s < 10 ? 2 : 1) + "s",
  age: (s) => {
    if (s === null || s === undefined) return "–";
    if (s < 90) return s.toFixed(1) + "s";
    if (s < 5400) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
    return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
  },
  bytes: (n) => {
    if (n === null || n === undefined) return "–";
    if (n < 1024) return n + "B";
    if (n < 1048576) return (n / 1024).toFixed(0) + "KB";
    return (n / 1048576).toFixed(0) + "MB";
  },
  // Separate from fmt.bytes, which tops out at MB: a coordinator sits at 4-6 GB,
  // and "5734MB" is a number the operator has to divide before it means anything.
  ram: (n) => {
    if (n === null || n === undefined) return "–";
    if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(0) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  },
  num: (n) => (n === null || n === undefined) ? "–" : String(n),
  clock: (epoch) => epoch ? new Date(epoch * 1000).toTimeString().slice(0, 8) : "–",
};

// The comment at server.py:997 calls exitcode the highest-value field in /health;
// don't make the operator look up what -11 means.
function exitcodeText(code) {
  if (code === null || code === undefined) return "";
  const known = {
    "-11": "SEGFAULT — a fork-safety regression",
    "-9": "SIGKILL — on a service that oscillates 4-6 GB RSS, read this as macOS jetsam",
    "-6": "SIGABRT — an assertion or C++ throw in the stack",
    "-15": "SIGTERM — reaped after a graceful exit timed out",
    "1": "Python exception — the traceback is in the log",
    "3": "died before hello — bad env or an import failure",
    "0": "clean exit",
  };
  return known[String(code)] ? code + " (" + known[String(code)] + ")" : String(code);
}

// textContent everywhere: some of these strings come from the LSST stack.
function put(parent, tag, text, cls) {
  const n = document.createElement(tag);
  if (text !== undefined && text !== null) n.textContent = text;
  if (cls) n.className = cls;
  parent.appendChild(n);
  return n;
}

// ------------------------------------------------------- state machine painting

// `activeState` rather than `current`, which is the module-level current job. Each
// diagram means exactly one thing: which state its subject is in right now. History
// tallies live in the JOBS header.
function paint(svgPrefix, nodeIds, activeState) {
  for (const name of nodeIds) {
    const g = el(svgPrefix + name);
    if (g) g.classList.toggle("current", name === activeState);
  }
}

const COORD_STATES = ["starting", "ready", "restarting", "degraded", "stopping"];
const JOB_STATES = ["PREPARED", "RECEIVING", "COMPUTING", "DONE", "ERROR"];

// One panel per flight, built from #flight-tpl on the first poll and reused after.
// Rebuilt only when the flight count changes, so a 1 Hz poll does not throw away
// and recreate N SVGs every second.
const panels = new Map();

function flightPanel(index) {
  let panel = panels.get(index);
  if (panel) return panel;

  const frag = el("flight-tpl").content.cloneNode(true);
  const prefix = "f" + index + "-";
  // paint() addresses nodes by id, so each clone's ids have to be distinct or every
  // flight would light up whichever state the last-rendered one is in.
  for (const node of frag.querySelectorAll("[id]")) node.id = prefix + node.id;
  const parts = {prefix};
  for (const node of frag.querySelectorAll("[data-el]")) parts[node.dataset.el] = node;
  el("flights").appendChild(frag);

  parts.restart.onclick = () => armRestart(index, parts.restart);
  panels.set(index, parts);
  return parts;
}

function renderFlights(h) {
  const flights = h.flights || [];
  if (panels.size !== flights.length) {
    el("flights").textContent = "";
    panels.clear();
  }
  // The pool's throughput next to its readiness, so the header answers "is it up"
  // and "has it done anything" together. Summed here rather than served as a
  // pool-wide field: the per-flight numbers are already in the body, and a second
  // server-side total could only ever disagree with their sum.
  const note = [h.n_ready + "/" + h.n_flights + " ready"];
  if (h.status === "partial") note.push("partial");
  const served = flights.reduce((a, f) => a + (f.exposures || 0), 0);
  note.push(served + (served === 1 ? " exposure" : " exposures"));
  el("coord-note").textContent = note.join("  ·  ");
  // The whole service's footprint, which is the number that matters against the
  // host's RAM -- and the only place the front-end's own pid is shown.
  const fe = h.front_end;
  if (fe) {
    const total = flights.reduce((a, f) => a + (f.rss_bytes || 0), 0) + (fe.rss_bytes || 0);
    el("frontend").textContent =
      "front-end pid " + fmt.num(fe.pid) + "  ·  " + fmt.ram(fe.rss_bytes) +
      "  ·  total " + fmt.ram(total);
  }
  for (const f of flights) renderCoord(f);
}

function renderCoord(h) {
  const parts = flightPanel(h.index);
  paint(parts.prefix + "c-", COORD_STATES, h.status);
  parts.title.textContent = "flight " + h.index;
  parts.note.textContent = h.ready ? "ready" : h.status;

  const facts = parts.facts;
  facts.textContent = "";
  // alive and ready are shown separately on purpose: is_alive() is true both for a
  // child 15 s into importing afw and for one whose fork pool is wedged
  // (server.py:283). alive + !ready + in_flight>0, sustained, is that wedge.
  put(facts, "span", "alive", "chip " + (h.alive ? "on" : "off"));
  put(facts, "span", "ready", "chip " + (h.ready ? "on" : "off"));
  put(facts, "span", h.primed ? "primed" : "unprimed", "chip " + (h.primed ? "on" : "off"));
  put(facts, "span", h.busy ? "busy" : "idle", "chip " + (h.busy ? "on" : ""));
  // Only shown when the cached config may not describe the live child, since the
  // ordinary case is "current" and a permanent chip for that is just noise.
  if (h.config && h.config.stale) {
    put(facts, "span", "config stale", "chip off");
  }
  const pairs = [
    // First, and ahead of the health counters: it is the throughput question
    // these side-by-side panels are read to answer. Since the front-end came
    // up, not since this child did -- a restart does not undo the work.
    ["exposures", fmt.num(h.exposures)],
    ["gen", fmt.num(h.generation)], ["spawns", fmt.num(h.spawns)],
    ["attempts", fmt.num(h.restart_attempts)], ["pid", fmt.num(h.pid)],
    // The coordinator's own RSS, not its process group's: the task's eight fork
    // workers share these pages copy-on-write, so summing them would report
    // tens of GB that do not exist (server.py rss_bytes).
    ["rss", fmt.ram(h.rss_bytes)],
    ["up", fmt.age(h.child_uptime_s)], ["in-flight", fmt.num(h.in_flight)],
    // The backlog on this lane: prepares and pushes waiting on its lock. Sustained
    // depth on one flight while another sits idle means routing, not capacity.
    ["queued", fmt.num(h.queue_depth)],
  ];
  if (h.primed_args) {
    const a = h.primed_args;
    pairs.push(["primed", a.physical_filter + " / ra " +
                Number(a.boresight_ra).toFixed(3) + " dec " + Number(a.boresight_dec).toFixed(3)]);
    // The digest form: a -c entry whole, a -C entry as its name plus a line count.
    // The bodies are never in /health -- /config has the resulting full config.
    const ov = a.config_overrides || [];
    if (ov.length) {
      pairs.push(["overrides", ov.map(o => o.kind === "value"
        ? o.field + "=" + o.value
        : "-C " + o.name + " (" + o.lines + "L)").join("  ")]);
    }
  }
  for (const [k, v] of pairs) {
    const s = put(facts, "span", k + " ");
    put(s, "b", v);
  }
  if (h.config) {
    // A link rather than inlined text: the dump is ~77 KB. No credential needed,
    // since this page is loopback-only and /config exempts loopback too.
    const s = put(facts, "span", "config ");
    const a = put(s, "a", h.config.sha256 + (h.config.n_overrides
      ? " (" + h.config.n_overrides + " override" + (h.config.n_overrides === 1 ? "" : "s") + ")"
      : " (defaults)"));
    a.href = "/config";
    a.target = "_blank";
  }

  const loss = parts.loss;
  loss.textContent = "";
  const hot = h.status === "restarting" || h.status === "degraded";
  el(parts.prefix + "e-ready-restarting").classList.toggle("hot", hot);
  if (h.degraded_reason) {
    put(loss, "div", "degraded: " + h.degraded_reason);
  }
  if (h.last_loss) {
    const L = h.last_loss;
    const bits = ["last loss @ " + fmt.clock(L.at), "gen " + fmt.num(L.generation),
                  "pid " + fmt.num(L.pid)];
    if (L.provoked_by) bits.push("provoked by " + L.provoked_by);
    put(loss, "div", bits.join("  ·  "));
    const ec = exitcodeText(L.exitcode);
    if (ec) put(loss, "div", "exitcode " + ec);
    if (L.reason) put(loss, "div", L.reason);
  }
}

// ----------------------------------------------------------------- plot flights

// One row per plot flight, rebuilt each poll rather than cached like the flight
// panels above: a row is a handful of spans, not an SVG, so there is nothing
// worth the bookkeeping of reusing it.
// Which job each plot flight was drawing at the last health poll, as one string.
// Null rather than "" so the first poll does not read as a change: an idle pool
// at startup should not trigger a scan the 5 s loop is about to do anyway.
let lastBusy = null;

function renderPlotFlights(h) {
  const rows = el("plotrows");
  const flights = h.plot_flights || [];
  const q = h.plot_queue || {depth: 0, drawing: {}};

  // The headline is the backlog, because that is the number that decides whether
  // --num-plot-flights needs raising. Depth is pool-wide: one LIFO stack feeds
  // every lane, so there is no per-flight split to report.
  const parts = [];
  // Counted rather than assumed: a pool whose every flight is degraded has
  // length but draws nothing, and enqueueing into it only grows a backlog that
  // sits there -- so it reads as "not being drawn" too, and the button is off.
  const live = flights.filter((f) => f.status !== "degraded").length;
  if (!flights.length) {
    parts.push("none running — plots are not being drawn");
  } else {
    parts.push(flights.length + (flights.length === 1 ? " flight" : " flights"));
    if (!live) parts.push("all degraded — nothing is being drawn; restart below");
    else if (live < flights.length) parts.push(live + " still drawing");
    parts.push(q.depth + " queued");
    // Said once here rather than on every row, and only when it is load-bearing.
    if (q.depth) parts.push("newest drawn first");
  }
  el("plot-note").textContent = parts.join("  ·  ");
  el("backfill").disabled = !live;

  // A draw that just finished turned a "missing" into a plotted job without any
  // job count changing, so the jobs poll's trigger cannot see it. The signature
  // is the busy set changing: a flight that was drawing something and now is
  // not has either written six PNGs or recorded an error, and both move the
  // scan. Joined with a separator no job id can contain.
  const busy = flights.map((f) => (q.drawing || {})[String(f.index)] || "").join(" ");
  if (busy !== lastBusy) {
    lastBusy = busy;
    pollPlotSurvey();
  }

  rows.textContent = "";
  for (const f of flights) {
    const row = put(rows, "div", "", "prow");
    put(row, "b", "plot " + f.index);
    put(row, "span", f.ready ? "ready" : f.status,
        "chip " + (f.ready ? "on" : "off"));

    // Busy/idle as a chip, exactly as the compute flights report it above --
    // including the convention that idle is an unstyled chip rather than a red
    // one, because an idle plot flight is a healthy plot flight.
    const job = (q.drawing || {})[String(f.index)];
    put(row, "span", job ? "busy" : "idle", "chip " + (job ? "on" : ""));

    // Which job, which is the one thing this section exists to answer that
    // /health's flight list cannot: the id, not just that something is drawing.
    if (job) {
      const s = put(row, "span", "drawing ");
      const a = put(s, "a", job.slice(0, 8), "jid");
      a.href = "/results/" + encodeURIComponent(job);
      a.target = "_blank";
    }

    // "drawn" rather than "exposures" off the same field: one exposure drawn is
    // what it counts here, and the word says which of the two pools this row is.
    for (const [k, v] of [["drawn", fmt.num(f.exposures)],
                          ["pid", fmt.num(f.pid)], ["rss", fmt.ram(f.rss_bytes)],
                          ["up", fmt.age(f.child_uptime_s)],
                          ["spawns", fmt.num(f.spawns)]]) {
      const s = put(row, "span", k + " ");
      put(s, "b", v);
    }
    // Only when there is something wrong: a plot flight in steady state should be
    // one quiet line.
    if (f.degraded_reason) put(row, "span", f.degraded_reason, "err");
    else if (f.last_loss && f.last_loss.reason) {
      put(row, "span", "last loss: " + f.last_loss.reason, "err");
    }
    // Offered only when it is the remedy. A DEGRADED plot flight holds no child
    // and draws nothing until restarted, and this is the only way to do it --
    // a bare /admin/restart reaches the compute flights alone.
    if (f.status === "degraded") {
      const btn = put(row, "button", "restart");
      btn.onclick = () => armRestart(f.index, btn, "plot");
    }
  }
}

// The scan is a disk walk, so it is not on the 1 Hz health loop -- but it does
// have to be live: `missing` falls as the queue drains and rises as new jobs
// finish, and a number that only moved on click would read as current when it is
// not. Polled slowly, and refreshed outright on the two events that change it.
//
// `null` means "not scanned yet", which is distinct from a scan that found
// nothing missing -- the first should say nothing, the second should say so.
let survey = null;

function renderBackfill() {
  // The queue depth is deliberately absent: it is in the section header above,
  // live from /health at 1 Hz, and repeating it here would be a second copy of
  // the same number going stale at a different rate.
  if (survey === null) {
    el("backfill-note").textContent = "";
  } else if (survey.error) {
    el("backfill-note").textContent = survey.error;
  } else {
    const parts = [survey.scanned + " on disk"];
    parts.push(survey.missing ? survey.missing + " missing plots" : "all plotted");
    el("backfill-note").textContent = parts.join("  ·  ");
  }
}

async function pollPlotSurvey() {
  let d;
  try {
    d = await api("/admin/plots");
  } catch (e) {
    return;  // transport hiccup; the next tick retries and the note holds
  }
  if (!d) return;
  // A 409 body carries `detail` and no counts -- an unset stamp dir, or a
  // directory that cannot be read. Worth saying: it is the reason the numbers
  // are missing, and it is not something the next poll will fix.
  survey = d.detail ? {error: d.detail} : d;
  renderBackfill();
}

el("backfill").onclick = async () => {
  const btn = el("backfill");
  btn.disabled = true;
  el("backfill-note").textContent = "scanning…";
  try {
    const r = await fetch("/admin/plots", {method: "POST", cache: "no-store"});
    if (!r.ok) {
      let detail = "";
      try { detail = (await r.json()).detail || ""; } catch (e) { /* not json */ }
      survey = {error: "failed: " + (detail || r.status)};
      renderBackfill();
      return;
    }
    const d = await r.json();
    // The POST answers the same counts as the survey, so adopt them rather than
    // waiting up to 5 s for the next poll to catch up with the click.
    survey = d;
    renderBackfill();
  } finally {
    // Re-enabled by the next poll if there are flights; this just releases the
    // click guard.
    btn.disabled = false;
  }
  pollHealth();
};

// ------------------------------------------------------------------- jobs table

let jobs = [];
// The job the detail panel and the per-job log are about: a pinned row if there is
// one, else whatever currentJob() picks. Only ever read, never assigned, outside
// renderJobs.
let current = null;
// The job_id of a clicked row, or null to follow the newest job. An id rather than
// a row or an index: rows are rebuilt from scratch every poll, and an index would
// silently slide onto a different job the moment a new one is created.
let pinned = null;

// `job_id` null unpins. Clicking the pinned row again also unpins, which is the
// gesture people try first and saves a trip to the button.
function pin(job_id) {
  pinned = (job_id === null || job_id === pinned) ? null : job_id;
  el("unpin").style.display = pinned ? "" : "none";
  // Repaint off the data already in hand rather than waiting up to a second for
  // the next poll, so the click feels like it did something.
  renderJobs(lastJobs);
}

el("unpin").onclick = () => pin(null);

// Escape unpins too. Ignored while a number input has focus, where it is the
// browser's own revert-the-edit key.
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape" || !pinned) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  pin(null);
});

// The last /admin/jobs body, kept so a click can re-render without a round-trip.
let lastJobs = {jobs: [], counts: {}, total: 0, returned: 0};

// DONE+ERROR at the last jobs poll, watched rather than diffed per-job: the
// backfill scan's counts are about what is on disk, and this count changing is
// exactly when a table was written. -1 so the first poll scans.
let lastSettled = -1;

function renderJobs(d) {
  lastJobs = d;
  jobs = d.jobs;
  const was = current;
  // A pin wins, but only while that job is still in the page: `limit` is finite and
  // the history grows, so a pinned job eventually falls off the end -- at which
  // point following the newest again is better than an empty panel.
  const held = pinned ? jobs.find((x) => x.job_id === pinned) : null;
  if (pinned && !held) {
    pinned = null;
    el("unpin").style.display = "none";
  }
  current = held || currentJob(d);
  renderJobLanes(d);

  const note = [d.total + " total"];
  // The per-state tallies, which used to sit inside the diagram's nodes. They belong
  // here: they describe the history in the table below, not the current job above.
  for (const state of JOB_STATES) {
    if (d.counts[state]) note.push(d.counts[state] + " " + state);
  }
  if (d.returned < d.total) note.push("showing newest " + d.returned);
  el("jobs-note").textContent = note.join("  ·  ");

  // A job reaching DONE wrote a stamp table, so the backfill scan's "on disk"
  // just changed and its "missing" has too until the plot lands. Rescan now
  // rather than leaving it to the 5 s loop: this is the moment the operator is
  // watching. ERROR counted alongside, since a job that failed before writing a
  // table still ends the window in which the numbers were right.
  const settled = (d.counts.DONE || 0) + (d.counts.ERROR || 0);
  if (settled !== lastSettled) {
    lastSettled = settled;
    pollPlotSurvey();
  }

  // The per-job log follows the current job, so it has to reload when that changes.
  if (logMode === "job" && current && (!was || was.job_id !== current.job_id)) {
    logSize = -1;
    pollLog(true);
  }

  const body = el("jobs-body");
  body.textContent = "";
  for (const j of jobs) {
    const tr = put(body, "tr");
    // Pinned beats followed, so a click on the row the panel was already following
    // reads as pinned rather than looking like nothing happened.
    if (j.job_id === pinned) tr.className = "pin";
    else if (current && j.job_id === current.job_id) tr.className = "sel";
    // On the row, not on each cell: the two links inside the results cell call
    // stopPropagation, so opening a result does not also pin its row.
    tr.onclick = () => pin(j.job_id);
    tr.title = "click for this job's detail; click again to follow the newest";
    const t = j.push_timings || {};
    const s = j.summary || {};
    const q = j.quantum || {};
    put(tr, "td", short(j.job_id));
    put(tr, "td", fmt.num(j.flight), "num");
    // The id an operator actually has in hand -- it is what they passed to
    // donutClient --visit -- and the only column here that is not about the
    // service's own bookkeeping. Absent until the push builds the quantum, so a
    // PREPARED row legitimately has none.
    put(tr, "td", fmt.num(q.visit), "num");
    put(tr, "td", j.state, "s-" + j.state);
    put(tr, "td", fmt.clock(j.created_wall));
    put(tr, "td", fmt.age(j.age_s), "num");
    put(tr, "td", fmt.secs(t.coordinator_total_s), "num");
    put(tr, "td", fmt.num(s.n_rows), "num");
    put(tr, "td", fmt.num(s.n_detectors), "num");
    put(tr, "td", s.n_groups === undefined ? "–" : s.n_groups_succeeded + "/" + s.n_groups, "num");
    const td = put(tr, "td");
    if (j.has_table) {
      // A real href to /results/<id>, so middle-click and cmd-click open a tab the
      // way they should.
      const view = put(td, "a", "view");
      view.href = "/results/" + encodeURIComponent(j.job_id);
      view.target = "_blank";
      view.rel = "noopener";
      view.onclick = (ev) => ev.stopPropagation();
      td.appendChild(document.createTextNode("  "));
      // Fetched and saved as a blob rather than a plain href, so the file lands
      // named after its job id instead of "table".
      const dl = put(td, "a", ".parquet");
      dl.href = "#";
      dl.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); download(j); };
    } else {
      td.textContent = "–";
    }
  }
  renderDetail();
}

async function download(j) {
  const r = await fetch(j.table_url);
  if (!r.ok) { banner("download", "download failed: " + r.status + " " + j.table_url); return; }
  banner("download", null);
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement("a");
  a.href = url;
  a.download = j.job_id + ".parquet";
  a.click();
  URL.revokeObjectURL(url);
}

const short = (id) => id.slice(0, 8) + "…";

// The one job the diagram is about: whatever is in flight, else the most recent, so
// between jobs the last outcome stays lit rather than the diagram going blank. With
// N flights several jobs can be non-terminal at once, so pick the newest of them --
// jobs arrives newest-first from /admin/jobs. Past jobs live in the table below.
function currentJob(d) {
  const ids = new Set(d.active_job_ids || []);
  return jobs.find((x) => ids.has(x.job_id)) || jobs[0] || null;
}

// One job diagram per flight, built from #job-tpl. Same clone-and-prefix scheme as
// flightPanel, and the same reason for caching: the ids are what paint() addresses.
const jobPanels = new Map();

function jobPanel(index) {
  let panel = jobPanels.get(index);
  if (panel) return panel;

  const frag = el("job-tpl").content.cloneNode(true);
  const prefix = "j" + index + "-";
  for (const node of frag.querySelectorAll("[id]")) node.id = prefix + node.id;
  const parts = {prefix};
  for (const node of frag.querySelectorAll("[data-el]")) parts[node.dataset.el] = node;
  el("jobs-per-flight").appendChild(frag);
  jobPanels.set(index, parts);
  return parts;
}

// The job each lane's diagram is about: whatever that lane has in flight, else the
// last job it ran, so an idle lane shows its last outcome rather than going blank.
// Rows arrive newest-first from /admin/jobs, so the first match is the newest one.
function renderJobLanes(d) {
  // Driven by /health's flight count rather than by the jobs: a lane that has
  // never run anything still gets a panel, in its own fixed column.
  const n = (health && health.n_flights) || 1;
  if (jobPanels.size !== n) {
    el("jobs-per-flight").textContent = "";
    jobPanels.clear();
  }
  const active = new Set(d.active_job_ids || []);
  let shown = 0;
  for (let i = 0; i < n; i++) {
    const parts = jobPanel(i);
    const mine = jobs.filter((x) => x.flight === i);
    const job = mine.find((x) => active.has(x.job_id)) || mine[0] || null;
    paint(parts.prefix + "j-", JOB_STATES, job ? job.state : null);
    parts.title.textContent = "flight " + i;
    const note = parts.note;
    note.textContent = "";
    if (!job) {
      note.textContent = "no jobs on this flight";
      continue;
    }
    shown++;
    put(note, "b", short(job.job_id));
    note.appendChild(document.createTextNode("  " + job.state + "  " +
      (active.has(job.job_id)
        ? "in flight " + fmt.secs(job.age_s)
        : "(last, " + fmt.age(job.age_s) + " ago)")));
  }
  // Only the jobs the front-end can still attribute to a lane are drawn above, so
  // say when the newest rows are not among them rather than letting the panels
  // look like the whole story.
  const unrouted = jobs.filter((x) => x.flight === null || x.flight === undefined).length;
  el("job-note").textContent = shown === 0 && !unrouted
    ? "no jobs yet"
    : (unrouted ? unrouted + " job" + (unrouted === 1 ? "" : "s") +
                  " with no routing on record (front-end restarted)" : "");
}

const PHASES = [
  ["receive_s", "recv", "#4a86c7"], ["layout_s", "layout", "#5b7fa8"],
  ["decode_s", "decode", "#4ba36b"], ["butler_put_s", "put", "#5f9e78"],
  ["dataset_refs_s", "refs", "#6f9a84"], ["run_quantum_s", "runQuantum", "#c99a3d"],
  ["serialize_s", "serialize", "#a8794a"], ["gc_s", "gc", "#8b93a1"],
];

function renderDetail() {
  const d = el("detail");
  d.textContent = "";
  const j = current;
  if (!j) {
    put(d, "div", "no jobs yet — this panel follows the newest one", "row");
    return;
  }

  const head = put(d, "div", "", "row");
  put(head, "b", j.job_id);
  head.appendChild(document.createTextNode("  " + j.state +
    (j.flight === null || j.flight === undefined ? "" : "  ·  flight " + j.flight) +
    "  ·  created " + fmt.clock(j.created_wall) + "  ·  " + fmt.age(j.age_s) + " ago"));
  // Which mode this panel is in. Without it a pinned panel on a quiet service is
  // indistinguishable from an unpinned one, and the operator has no way to tell
  // that it has stopped advancing.
  put(head, "span", pinned ? "   pinned" : "   following newest",
      pinned ? "chip on" : "chip");

  if (j.error) put(d, "div", j.error, "err");

  const t = j.push_timings;
  if (t) {
    const total = PHASES.reduce((a, [k]) => a + (t[k] || 0), 0);
    const bar = put(d, "div", "", "bar");
    for (const [k, label, colour] of PHASES) {
      const v = t[k];
      if (!v) continue;
      const seg = put(bar, "div", v / total > 0.09 ? label : "");
      seg.style.width = (100 * v / total).toFixed(2) + "%";
      seg.style.background = colour;
      seg.title = label + " " + v.toFixed(3) + "s";
    }
    const line = PHASES.filter(([k]) => t[k] !== undefined)
      .map(([k, label]) => label + " " + t[k].toFixed(3) + "s").join("  ");
    put(d, "div", line, "row");
    const foot = ["blob " + fmt.bytes(t.blob_bytes),
                  "coordinator total " + fmt.secs(t.coordinator_total_s)];
    if (t.run_quantum_s && t.coordinator_total_s) {
      foot.push("runQuantum is " +
        (100 * t.run_quantum_s / t.coordinator_total_s).toFixed(0) + "% of it");
    }
    if (t.gc_collected !== undefined) foot.push("gc reclaimed " + t.gc_collected);
    put(d, "div", foot.join("  ·  "), "row");
  }

  const p = j.prepare_timings;
  if (p) {
    const bits = [];
    if (p.calib) {
      bits.push("calib " + (p.calib.reused ? "reused" : "loaded") +
                " " + fmt.secs(p.calib.elapsed_s));
    }
    if (p.refcat) {
      const r = p.refcat;
      const parts = [(r.reused ? "reused" : "loaded") + " " + fmt.secs(r.elapsed_s)];
      if (r.n_level7_shards) {
        parts.push(r.n_level7_shards + " shards from " + r.n_level5_files + " files");
      }
      if (r.n_rows) parts.push(r.n_rows.toLocaleString() + " rows");
      bits.push("refcat " + parts.join(", "));
    }
    put(d, "div", "prepare  " + bits.join("  ·  "), "row");
  }

  const s = j.summary;
  if (s) {
    const bits = [s.n_rows + " rows", s.n_detectors + " detectors",
                  s.n_groups_succeeded + "/" + s.n_groups + " groups fit"];
    if (s.columns) bits.push(s.columns.length + " columns");
    if (s.dropped_columns && s.dropped_columns.length) {
      bits.push("dropped " + s.dropped_columns.join(", "));
    }
    put(d, "div", "summary  " + bits.join("  ·  "), "row");
    if (s.rows_per_detector) {
      put(d, "div", "per detector  " + Object.entries(s.rows_per_detector)
        .map(([k, v]) => k + " " + v).join("  "), "row");
    }
  }
  if (j.quantum) {
    put(d, "div", "quantum  " + Object.entries(j.quantum)
      .map(([k, v]) => k + " " + v).join("  ·  "), "row");
  }
}

// -------------------------------------------------------------------- log panel

let logMode = "tail";

el("tab-tail").onclick = () => setLogMode("tail");
el("tab-job").onclick = () => setLogMode("job");
function setLogMode(mode) {
  logMode = mode;
  logSize = -1;
  el("tab-tail").classList.toggle("sel", mode === "tail");
  el("tab-job").classList.toggle("sel", mode === "job");
  pollLog(true);
}

function showLog(d, force) {
  if (!d) return;
  // The unchanged short-circuit carries no path, so don't blank the label with it.
  if (d.path) el("log-path").textContent = d.path;
  if (d.unchanged) return;
  if (d.exists === false) {
    el("logtext").textContent =
      "(log not created yet — the coordinator configures logging after its hello)";
    return;
  }
  if (d.found === false) {
    el("logtext").textContent =
      "(no lines for this job in the last " + fmt.bytes(d.searched_bytes) + " of the log)";
    return;
  }
  const pre = el("logtext");
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 24;
  let text = d.text;
  if (d.truncated) text = "… truncated, showing " + fmt.bytes(d.returned_bytes) + " …\n" + text;
  pre.textContent = text;
  if (atBottom || force) pre.scrollTop = pre.scrollHeight;
}

// ----------------------------------------------------------------- poll loops
// setTimeout chains, not setInterval, so exactly one request per panel is ever in
// flight; and paused while the tab is hidden, so a page left open overnight does
// not spend the night polling.

let health = null;

function visible() { return document.visibilityState === "visible"; }

function loop(fn, everyMs) {
  const tick = async () => {
    if (visible()) {
      try { await fn(); } catch (e) { /* transport hiccup; next tick retries */ }
    }
    setTimeout(tick, everyMs);
  };
  tick();
}

// Driven by /admin/jobs, not /health: /health answers even a caller it refuses
// detail to, so keying liveness off it would report "polling" on a dashboard that
// cannot read a job.
let lastOk = 0;

async function pollHealth() {
  const h = await api("/health");
  if (!h) return;
  health = h;
  renderFlights(h);
  renderPlotFlights(h);
}

async function pollJobs() {
  const limit = Math.max(1, Math.min(500, Number(el("limit").value) || 50));
  const d = await api("/admin/jobs?limit=" + limit);
  if (!d) return;
  lastOk = Date.now();
  renderJobs(d);
}

async function pollLog(force) {
  let d;
  if (logMode === "job") {
    if (!current) {
      el("logtext").textContent = "(no jobs yet)";
      return;
    }
    d = await api("/admin/log/" + encodeURIComponent(current.job_id));
  } else {
    const n = Math.max(4096, Math.min(1048576, Number(el("log-bytes").value) || 65536));
    const since = force ? "" : "&since_size=" + logSize;
    d = await api("/admin/log?bytes=" + n + since);
  }
  if (d && d.size !== undefined) logSize = d.size;
  showLog(d, force);
}

setInterval(() => {
  const chip = el("poll");
  if (!visible()) { chip.textContent = "paused"; chip.className = "chip"; return; }
  if (problems.has("auth")) { chip.textContent = "unauthorized"; chip.className = "chip off"; return; }
  const age = (Date.now() - lastOk) / 1000;
  chip.textContent = lastOk ? "polling  " + age.toFixed(1) + "s ago" : "connecting";
  chip.className = "chip " + (lastOk && age < 5 ? "on" : "off");
}, 250);

document.addEventListener("visibilitychange", () => {
  if (visible()) { pollHealth(); pollJobs(); pollPlotSurvey(); }
});

loop(pollHealth, 1000);
loop(pollJobs, 1000);
// Slower than the rest of the page on purpose: this one walks the stamp
// directory. The event-driven refreshes above are what keep it feeling live, and
// this loop is the floor under them.
loop(pollPlotSurvey, 5000);
loop(() => { if (el("log-auto").checked) return pollLog(false); }, 2000);

// ------------------------------------------------------------- restart control
// The only non-read-only control here, and it SIGKILLs the child's process group
// (server.py:553), so anything COMPUTING dies with it. Two-step, and it says which
// job it is about to kill.

// One arming at a time across all the buttons: arming flight 1's while flight 0's is
// already armed disarms flight 0's, so a second click can never hit a lane the
// warning was not about.
let armed = null;

function disarm() {
  if (!armed) return;
  clearTimeout(armed.timer);
  armed.button.textContent = armed.label;
  armed.button.classList.remove("armed");
  armed = null;
}

// index === null restarts every flight, which is what the bare endpoint means.
// `poolName` defaults to the compute flights, which is every caller but the plot
// rows: a restart there is the only way out of DEGRADED for a plot flight, and
// it risks nothing an operator needs warning about -- at worst one plot redraws.
async function armRestart(index, button, poolName) {
  const mine = armed && armed.button === button;
  disarm();
  if (!mine) {
    const label = button.textContent;
    button.textContent = "confirm — " +
      (poolName === "plot" ? "restart plot flight " + index + "?" : atRisk(index));
    button.classList.add("armed");
    armed = {button, label, timer: setTimeout(disarm, 5000)};
    return;
  }
  const params = [];
  if (index !== null) params.push("flight=" + index);
  if (poolName) params.push("pool=" + poolName);
  const query = params.length ? "?" + params.join("&") : "";
  const d = await api("/admin/restart" + query, {method: "POST"});
  if (d) {
    banner("restart", "restart requested — " + (d.flights || []).map(
      (f) => "flight " + f.index + ": killed pid " + f.killed_pid + ", " + f.state
    ).join("  ·  "));
    setTimeout(() => banner("restart", null), 8000);
  }
  pollHealth();
}

// What this restart is about to destroy. Only jobs routed to the targeted flights
// die, but /admin/jobs does not say which flight a job is on, so name the jobs when
// restarting everything and fall back to the flight's own busy/in-flight state
// otherwise.
function atRisk(index) {
  const flights = (health && health.flights) || [];
  if (index !== null) {
    const f = flights.find((x) => x.index === index);
    return f && (f.in_flight > 0 || f.busy)
      ? "flight " + index + " is busy and its job will be killed"
      : "restart flight " + index + "?";
  }
  const running = jobs.filter((x) => ["PREPARED", "RECEIVING", "COMPUTING"].includes(x.state));
  if (running.length) {
    return "this KILLS " + running.map((j) => short(j.job_id) + " (" + j.state + ")").join(", ");
  }
  return "restart all " + flights.length + " flights?";
}

el("restart").onclick = () => armRestart(null, el("restart"));
</script>
